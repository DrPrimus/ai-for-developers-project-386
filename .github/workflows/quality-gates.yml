name: Quality Gates

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Git credentials (for git operations in CI)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Install mise
        uses: jdx/mise-action@v5

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('FE/package-lock.json', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache frontend dependencies
        uses: actions/cache@v6
        with:
          path: FE/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('FE/package-lock.json', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Run quality gates check (backend + frontend)
        run: |
          mise run check
