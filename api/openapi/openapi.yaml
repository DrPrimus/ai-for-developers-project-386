openapi: 3.1.0
info:
  title: Календарь звонков
  description: API сервиса бронирования календаря звонков. Контракт — источник истины для бэкенда и фронтенда.
  version: 0.0.0
tags:
  - name: Meeting types
  - name: Meetings
paths:
  /api/meeting-types:
    get:
      operationId: MeetingTypes_list
      description: Список типов встреч, созданных владельцем.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingTypeListResponse'
      tags:
        - Meeting types
    post:
      operationId: MeetingTypes_create
      description: Создать тип встречи.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      tags:
        - Meeting types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingTypeCreate'
  /api/meeting-types/{meetingTypeId}/slots:
    get:
      operationId: MeetingTypes_slots
      description: Свободные слоты типа встречи на всё окно бронирования.
      parameters:
        - name: meetingTypeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotListResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Meeting types
  /api/meetings:
    post:
      operationId: Meetings_book
      description: Забронировать слот. Проверка пересечения и вставка атомарны.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotConflictResponse'
      tags:
        - Meetings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingRequest'
  /api/meetings/upcoming:
    get:
      operationId: Meetings_upcoming
      description: Предстоящие встречи в окне бронирования, отсортированные по началу.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingMeetingsResponse'
      tags:
        - Meetings
components:
  schemas:
    BookingWindow:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
      description: 'Окно бронирования: сегодня и следующие 13 календарных дней.'
    DaySlots:
      type: object
      required:
        - date
        - slots
      properties:
        date:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
      description: Слоты одного календарного дня окна бронирования.
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
      description: Единый конверт ошибки.
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    Meeting:
      type: object
      required:
        - id
        - meetingType
        - startsAt
        - endsAt
      properties:
        id:
          type: string
          format: uuid
        meetingType:
          $ref: '#/components/schemas/MeetingTypeSummary'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      description: Забронированная встреча.
    MeetingRequest:
      type: object
      required:
        - meetingTypeId
        - startsAt
      properties:
        meetingTypeId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
      description: Запрос на бронирование слота.
    MeetingType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 'Название после trim: 1–100 символов.'
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: 'Описание после trim: 1–500 символов.'
        durationMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 480
          multipleOf: 5
          description: 'Длительность слота в минутах: 5–480, кратно 5.'
      description: Тип встречи, созданный владельцем.
    MeetingTypeCreate:
      type: object
      required:
        - name
        - description
        - durationMinutes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 'Название после trim: 1–100 символов.'
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: 'Описание после trim: 1–500 символов.'
        durationMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 480
          multipleOf: 5
          description: 5–480 минут, кратно 5.
      description: Данные для создания типа встречи.
    MeetingTypeListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MeetingType'
    MeetingTypeSummary:
      type: object
      required:
        - id
        - name
        - durationMinutes
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        durationMinutes:
          type: integer
          format: int32
      description: Краткие данные типа встречи внутри встречи.
    Slot:
      type: object
      required:
        - startsAt
        - endsAt
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      description: 'Свободный слот: полуинтервал [startsAt, endsAt).'
    SlotConflictResponse:
      type: object
      required:
        - date
        - slots
      properties:
        date:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      description: 'Ошибка занятого слота: альтернативы того же дня после конфликта.'
    SlotListResponse:
      type: object
      required:
        - timeZone
        - window
        - days
      properties:
        timeZone:
          type: string
        window:
          $ref: '#/components/schemas/BookingWindow'
        days:
          type: array
          items:
            $ref: '#/components/schemas/DaySlots'
    UpcomingMeetingsResponse:
      type: object
      required:
        - timeZone
        - window
        - items
      properties:
        timeZone:
          type: string
        window:
          $ref: '#/components/schemas/BookingWindow'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Meeting'
    ValidationErrorResponse:
      type: object
      properties:
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
servers:
  - url: http://localhost:8080
    description: Локальный бэкенд
    variables: {}
